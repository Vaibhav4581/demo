name: Build & Release Emergency Mesh APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Debug APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./routing-app/gradlew

      - name: Configure Gradle Environment for Linux Runner
        run: sed -i '/org.gradle.java.home/d' routing-app/gradle.properties

      - name: Run All Automated Unit Tests
        working-directory: ./routing-app
        run: ./gradlew :mesh-core:test :mesh-sim:test :mesh-android:testDebugUnitTest :app:testDebugUnitTest

      - name: Build Debug APK
        working-directory: ./routing-app
        run: ./gradlew :app:assembleDebug

      - name: Stage APK for Direct GitHub Pages Hosting
        run: |
          cp routing-app/app/build/outputs/apk/debug/app-debug.apk web/app-debug.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Emergency Mesh Build"
          make_latest: true
          body: |
            ### 🚀 Automated Build Completed
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Direct Download:** [app-debug.apk](https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk)
            - **Web Portal:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            
            Install directly on any Android 8.0+ device to test decentralized disaster mesh communication.
          draft: false
          prerelease: false
          files: routing-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy-pages:
    name: Deploy Web Portal & Direct Download
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
